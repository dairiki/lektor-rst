[tox]
envlist = py39,py310,py311,py312,py313,py314


[testenv]
commands =
    py.test --cov lektor_rst {posargs} --cov-report term --cov-report html:{toxinidir}/htmlcov_{envname}
deps =
    flake8
    pyquery
    # pytest-flake8 as of 1.3.0 is incompatible with pytest >= 9.1.0.
    # ref https://github.com/coherent-oss/pytest-flake8/issues/5
    pytest<9.1
    pytest-cov
    pytest-flake8


[pytest]
addopts = --flake8 -ra --cov-report=term --cov-report=html
testpaths = tests
flake8-ignore = E501
